<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1017">
<title>一斉 — コントローラ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0e1017; color: #fff; overscroll-behavior: none;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  body { display: flex; flex-direction: column; }

  /* 自分の形と色を常に大きく出す。これがアイデンティティの錨になる。 */
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; }
  header canvas { width: 40px; height: 40px; }
  header .nm { font-weight: 700; font-size: 17px; }
  header .sc { margin-left: auto; font: 500 15px ui-monospace, monospace; color: #8e97ab; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px; }

  /* ボタンだけ。押した瞬間に色と振動で即応答する。サーバー確認は待たない。 */
  #btn {
    width: 100%; max-width: 460px; height: 100%; max-height: 460px;
    border: none; border-radius: 30px;
    background: #E8112D; color: #fff;
    font: 900 46px "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    box-shadow: 0 10px 0 #8d0a1c;
    transition: transform .04s, box-shadow .04s, background .12s;
  }
  #btn:active, #btn.hit { transform: translateY(9px); box-shadow: 0 1px 0 #8d0a1c; }
  #btn.hit { background: #FFD400; color: #141414; }
  #btn:disabled { background: #262c3a; color: #59627a; box-shadow: 0 10px 0 #171b26; }

  footer { padding: 12px 18px 26px; text-align: center; color: #59627a;
    font: 500 12px ui-monospace, monospace; }

  #join { position: fixed; inset: 0; background: #0e1017; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 28px; }
  #join h1 { font-size: 40px; }
  #join p { color: #8e97ab; font-size: 14px; }
  #join input { width: 100%; max-width: 320px; padding: 16px; border-radius: 14px; border: 2px solid #2a3140;
    background: #161b25; color: #fff; font-size: 18px; text-align: center; }
  #join button { padding: 16px 44px; border-radius: 14px; border: none; background: #FFD400;
    color: #141414; font: 700 18px system-ui; }
</style>
</head>
<body>

<div id="join">
  <h1>一斉</h1>
  <p>なまえを入れて参加</p>
  <input id="name" maxlength="12" placeholder="ハンドルネーム" autocomplete="off">
  <button id="go">参加する</button>
  <p id="err" style="color:#E8112D"></p>
</div>

<header>
  <canvas id="me" width="80" height="80"></canvas>
  <span class="nm" id="myname"></span>
  <span class="sc" id="myscore">0点</span>
</header>

<main><button id="btn" disabled>まちうけ</button></main>

<footer id="foot"></footer>

<script src="common.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const lag = Number(params.get('lag')) || 0;   // 検証用の人工遅延

let me = null, state = null, sent = false;

$('#go').onclick = async () => {
  const name = $('#name').value.trim();
  const r = await GG.net.post('/api/join', { name });
  if (!r) { $('#err').textContent = '接続できませんでした'; return; }
  me = r;
  $('#join').style.display = 'none';
  $('#myname').textContent = me.name;
  const c = $('#me').getContext('2d');
  c.setTransform(2, 0, 0, 2, 0, 0);
  GG.drawShape(c, me.shape, me.color, 20, 20, 17);

  await GG.clock.sync();
  GG.clock.startRefining();
  $('#foot').textContent = 'ズレ補正 ' + Math.round(GG.clock.offset) + 'ms / 往復 ' + GG.clock.rtt + 'ms'
    + (lag ? ' / 人工遅延 ' + lag + 'ms' : '');
  GG.net.listen(me.id, lag);
};

/* 手元にも、その場で伝える。大画面を見ていない一瞬に つかまっても
 * ゴールしても、手元が「おしっぱなし」のままだと何が起きたか分からない。
 * 判定は最後にサーバが時刻から作り直すので、ここは表示だけの話。 */
let myEnd = null;
GG.net.onPressed = (n, live) => {
  if (!live || !me || !state || state.phase !== 'play') return;
  const m = live[me.id];
  if (!m) return;
  const g = state.g || {};
  const ms = m.held + (m.moving ? Math.max(0, GG.clock.nowServer() - m.at) : 0);
  const dist = Math.min(g.goal || 240, ms / 1000 * (g.speed || 30));
  const end = m.caught ? 'caught' : dist >= (g.goal || 240) ? 'fin' : null;
  if (!end || myEnd === end) return;
  myEnd = end;
  const btn = $('#btn');
  btn.disabled = true; held = false;
  btn.textContent = end === 'caught' ? 'つかまった' : 'ゴール！';
  btn.classList.toggle('hit', end === 'fin');
  if (navigator.vibrate) navigator.vibrate(end === 'caught' ? [90, 50, 90] : [40, 60, 40]);
};

GG.net.onState = (s) => {
  myEnd = null;
  state = s;
  const btn = $('#btn');
  const p = state.players.find(x => x.id === (me && me.id));
  if (p) $('#myscore').textContent = p.score + '点';

  if (s.phase === 'play') {
    sent = false; held = false;
    btn.disabled = false;
    btn.classList.remove('hit');
    // 使う操作の形をここで見せる。親指を置く位置が確定する。
    btn.textContent = s.game.control === 'hold' ? 'おしっぱなし' : 'おす';
  } else if (s.phase === 'reveal') {
    btn.disabled = true; held = false;
    const mine = s.last && s.last.entries.find(e => e.id === (me && me.id));
    if (!mine) btn.textContent = '—';
    else if (s.last.game === 'seino') btn.textContent = mine.error === null ? '未入力' : GG.fmt(mine.error);
    else btn.textContent = mine.caught ? 'つかまった'
       : mine.finishedAt !== null ? 'ゴール！' : Math.round(mine.dist) + ' すすんだ';
    // 勝ちと負けで振動を変える
    const won = s.last && s.last.winners.indexOf(me && me.id) >= 0;
    if (navigator.vibrate) navigator.vibrate(won ? [40, 60, 40] : 140);
  } else {
    btn.disabled = true; held = false;
    btn.textContent = 'まちうけ';
  }
};

/* 押した瞬間の記録がすべて。ここで端末の時計を読み、
 * サーバー時刻に変換した値を「中身」として送る。
 * この通信が何ms遅れて届くかは判定に一切影響しない。 */
function stampOf(ev) {
  // event.timeStamp はイベントが発生した時刻。JS が処理した時刻ではないので、
  // メインスレッドが詰まっていても押下の瞬間を取り逃さない。
  const local = (ev && typeof ev.timeStamp === 'number' && ev.timeStamp > 0)
    ? ev.timeStamp : performance.now();
  return local + GG.clock.offset;
}

function post(body) {
  const fire = () => GG.net.post('/api/input', Object.assign({ id: me.id }, body));
  if (lag > 0) setTimeout(fire, lag); else fire();   // lag は検証用の人工遅延
}

let held = false;

/* 押しっぱなし系。押し始めと離した瞬間を、それぞれ時刻付きで送る。
 * サーバーは届いた順ではなく時刻で並べ直して判定する。 */
function holdDown(ev) {
  if (held || !state || state.phase !== 'play' || !me) return;
  if (state.game.control !== 'hold') return;
  held = true;
  const t = stampOf(ev);
  $('#btn').classList.add('hit');
  $('#btn').textContent = 'すすんでる';
  if (navigator.vibrate) navigator.vibrate(14);
  post({ t, down: true });
}

function holdUp(ev) {
  if (!held || !me) return;
  held = false;
  const t = stampOf(ev);
  $('#btn').classList.remove('hit');
  $('#btn').textContent = 'とまった';
  post({ t, down: false });
}

function press(ev) {
  if (sent || !state || state.phase !== 'play' || !me) return;
  if (state.game.control !== 'tap') return;
  // event.timeStamp はイベントが発生した時刻。JS が処理した時刻ではないので、
  // メインスレッドが詰まっていても押下の瞬間を取り逃さない。
  const at = stampOf(ev);
  sent = true;

  // 手応えは即返す。サーバーの返事を待たない。
  const btn = $('#btn');
  btn.classList.add('hit');
  btn.textContent = 'おした';
  if (navigator.vibrate) navigator.vibrate(18);

  post({ at });
}

const btn = $('#btn');
btn.addEventListener('pointerdown', (e) => { press(e); holdDown(e); });
btn.addEventListener('pointerup', holdUp);
btn.addEventListener('pointercancel', holdUp);
btn.addEventListener('pointerleave', holdUp);
addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat) return;
  e.preventDefault(); press(e); holdDown(e);
});
addEventListener('keyup', (e) => { if (e.code === 'Space') holdUp(e); });
</script>
</body>
</html>
