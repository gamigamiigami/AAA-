<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A1240">
<meta name="description" content="大画面とスマホで遊ぶ5〜30人のパーティゲーム「一斉」の体験デモ。">
<title>一斉 体験デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Yusei+Magic&display=swap">

<style>
  :root {
    --bg-a:   #3B1A5C;
    --bg-b:   #1C0C30;
    --card:   #331550;
    --edge:   #5B2E86;
    --ink:    #FFF6E3;
    --ink-2:  #C6A9E0;
    --ink-3:  #8E6BB0;
    --yellow: #FFC531;
    --red:    #FF4757;
    --blue:   #3D8BFF;
    --green:  #3FD46B;
    --f-disp: "Dela Gothic One", "Hiragino Maru Gothic ProN", sans-serif;
    --f-ui:   "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    --f-hand: "Yusei Magic", "Hiragino Maru Gothic ProN", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; color: var(--ink); font-family: var(--f-ui); line-height: 1.85;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #6B2E9E 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 70%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 34px 18px 80px;
    display: flex; flex-direction: column; gap: 26px; }

  /* ---- 見出し ---- */
  /* ロゴはページに置かない。すぐ下の大画面の中に本物が映っているので、
     ここにもう1つ置くと同じ絵が320px離れて2度出る。ヒーローは画面のほう。
     見出しは小さな文字で名前だけ残す。 */
  .hero { text-align: center; display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .hero h1 { font-family: var(--f-disp); font-size: clamp(19px, 4vw, 24px);
    font-weight: 400; letter-spacing: .3em; text-indent: .3em;
    color: var(--yellow); margin: 0; }
  .hero .sub { font-family: var(--f-hand); font-size: clamp(13px, 3vw, 17px);
    color: var(--ink-2); transform: rotate(.6deg); }

  /* ---- 会場 ---- */
  .venue { display: grid; gap: 18px; grid-template-columns: 1fr 300px; align-items: start; }
  @media (max-width: 880px) { .venue { grid-template-columns: 1fr; } }

  .tag { font-family: var(--f-hand); font-size: 12px; color: var(--ink-3);
    margin: 0 0 7px 6px; display: flex; align-items: center; gap: 7px; }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }

  .screen-box {
    border-radius: 18px; overflow: hidden; background: #1C0C30;
    border: 4px solid #241a2e;
    box-shadow: 0 10px 0 #150822, 0 26px 50px rgba(0,0,0,.6);
  }
  .screen-box canvas { display: block; width: 100%; height: auto; }

  /* ---- スマホ ---- */
  .phone { border-radius: 30px; background: linear-gradient(180deg,#3E1C60,#2B1044);
    border: 4px solid #241a2e; box-shadow: 0 9px 0 #150822, 0 20px 40px rgba(0,0,0,.5);
    padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  .phone-top { display: flex; align-items: center; gap: 10px; }
  .phone-top canvas { width: 44px; height: 44px; }
  .phone-top .nm { font-weight: 900; font-size: 15px; }
  .phone-top .sc { margin-left: auto; font-family: var(--f-disp); font-size: 15px;
    color: var(--yellow); }

  #btn {
    border: 4px solid #241a2e; border-radius: 26px; padding: 0;
    font-weight: 900;
    height: 200px; width: 100%;
    background: linear-gradient(180deg, color-mix(in srgb, var(--me) 72%, #fff) 0%, var(--me) 55%, var(--me-dark) 100%);
    color: #fff; font-family: var(--f-disp); font-size: 27px; letter-spacing: .04em;
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
    box-shadow: 0 9px 0 var(--me-dark), 0 14px 20px rgba(0,0,0,.4);
    touch-action: manipulation; cursor: pointer;
    transition: transform .06s cubic-bezier(.2,.9,.3,1.4), box-shadow .06s, filter .12s;
  }
  #btn:active, #btn.hit { transform: translateY(8px); box-shadow: 0 1px 0 var(--me-dark); }
  #btn.hit { background: linear-gradient(180deg,#FFE07A 0%, var(--yellow) 55%, #E09A00 100%);
    color: #3A2400; text-shadow: 0 2px 0 rgba(255,255,255,.45); }
  #btn:disabled { background: linear-gradient(180deg,#4A2A6B,#3A1F55); color: #9B7ABA;
    box-shadow: 0 9px 0 #24123A; cursor: default; text-shadow: none; }
  #btn:focus-visible { outline: 4px solid var(--yellow); outline-offset: 4px; }
  .foot { font-family: var(--f-hand); font-size: 12px; color: var(--ink-3); text-align: center; }

  /* 結果。直前まで巨大な赤いボタンだった場所が、灰色の空箱に数字だけ、
     では熱が死ぬ。自分の分身が結果の顔をして、一言を言う。数字は添え物。 */
  #res { height: 200px; border-radius: 26px; border: 4px solid #241a2e;
    background: linear-gradient(180deg, var(--res-a, #4A2A6B), var(--res-b, #321B4C));
    box-shadow: 0 9px 0 #1B0E2E, 0 14px 20px rgba(0,0,0,.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; animation: pop .34s cubic-bezier(.2,.9,.3,1.5); }
  #res canvas { width: 66px; height: 66px; }
  #res .word { font-family: var(--f-disp); font-size: 27px; color: var(--res-ink, #fff);
    text-shadow: 0 3px 0 rgba(0,0,0,.35); letter-spacing: .03em; }
  #res .sub { font-family: var(--f-ui); font-weight: 700; font-size: 14px;
    color: rgba(255,246,227,.6); }
  @keyframes pop { from { transform: scale(.82); opacity: 0 } to { transform: none; opacity: 1 } }

  /* ---- 脚注 ---- */
  /* 設計理由を並べた解説カードは外した。作者が自分の判断を客に弁明した
     瞬間、それは製品ではなく提出物に見える。残すのは事実だけ。 */
  .foot-note { text-align: center; font-family: var(--f-hand); font-size: 13px;
    line-height: 2.1; color: var(--ink-3); margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <h1>一斉</h1>
    <div class="sub">大画面ひとつと、みんなのスマホで遊ぶ　5〜30人のパーティゲーム</div>
  </div>

  <div class="venue">
    <div>
      <p class="tag">大画面（プロジェクター）</p>
      <div class="screen-box"><canvas id="big" width="1280" height="720"></canvas></div>
    </div>
    <div>
      <p class="tag">あなたのスマホ</p>
      <div class="phone">
        <div class="phone-top">
          <canvas id="me" width="88" height="88"></canvas>
          <span class="nm">あなた</span>
          <span class="sc" id="sc">0</span>
        </div>
        <button id="btn">はじめる</button>
        <div id="res" hidden>
          <canvas id="resface" width="132" height="132"></canvas>
          <div class="word" id="resword">ぴったり！</div>
          <div class="sub" id="ressub">+0ms</div>
        </div>
        <div class="foot" id="foot">タップ、またはスペースキー</div>
      </div>
    </div>
  </div>

  <p class="foot-note">
    大画面ひとつと、みんなのスマホ。アプリも会員登録もいりません。<br>
    このページは体験版です。ほかの5人はコンピュータが動かしています。
  </p>

</div>

<script src="public/art.js"></script>
<script src="public/sound.js"></script>
<script src="public/stage.js"></script>
<script src="public/demo-game.js"></script>
</body>
</html>
