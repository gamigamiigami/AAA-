<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>一斉 — メイン画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #120724; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  /* 会場では誰も画面の隅を読まない。操作の案内は最小に、消えるように。 */
  #hint { position: fixed; left: 16px; bottom: 12px; color: #4A3568; font-size: 12px;
    font-family: "Zen Maru Gothic", system-ui, sans-serif; letter-spacing: .06em;
    transition: opacity .6s; }
</style>
</head>
<body>
<canvas id="screen" width="1280" height="720"></canvas>
<div id="hint">SPACE = かいし / ていし</div>

<script src="common.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="stage.js"></script>
<script>
'use strict';
/* メイン画面。描画はすべて stage.js に任せる。
 * デモと本番で描き分けを持つと必ず食い違い、どちらかが古くなる。 */
const S = Stage, W = S.W, H = S.H;
const cv = document.getElementById('screen');
const c = cv.getContext('2d');
const hintEl = document.getElementById('hint');

let net = null, running = false;
const fired = new Set();                 // 同じ合図で二度鳴らさない
const st = { tSec: 0, revealT: 0, players: [], order: [], code: null,
             last: null, sent: 0, watching: false, chant: null, goal: 240,
             cardWord: '', cardHue: '#2E7BC4', cardT: 1 };
let live = null, liveAt = 0;
let phase = 'lobby', game = null, gs = null, beat = S.BEAT, countIn = 4, round = -1;
let shake = 0, flash = 0, hitStop = 0, prevMs = 0;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
}
addEventListener('resize', resize); resize();

addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  Snd.init();
  running = !running;
  hintEl.style.opacity = running ? 0 : 1;
  GG.net.post(running ? '/api/start' : '/api/stop');
});

/* 参加者はフレームをまたいで生かす。毎回作り直すとバネも瞬きも初期化され、
 * 全員が同じ位相で同じ動きになる。 */
const pool = new Map();
function syncPlayers(list) {
  let changed = list.length !== st.players.length;
  const next = list.map((r, i) => {
    let p = pool.get(r.id);
    if (!p) { p = { id: r.id, seed: (r.id * 2654435761 >>> 0) % 1000,
                    face: 'smile', poseName: 'idle', dist: 0, moving: false };
              pool.set(r.id, p); changed = true; }
    p.name = r.name; p.shape = r.shape; p.color = r.color; p.score = r.score;
    if (st.players[i] && st.players[i].id !== r.id) changed = true;
    return p;
  });
  st.players = next;
  if (changed) st.order = S.seat(next);
}

GG.net.onState = (s) => {
  syncPlayers(s.players);
  st.code = s.code;
  beat = s.beat || S.BEAT;
  if (s.round !== round) { round = s.round; fired.clear(); live = null; }
  game = s.game && s.game.id; gs = s.g;
  countIn = (s.game && s.game.countIn) || 4;
  if (s.g && s.g.goal) st.goal = s.g.goal;

  if (s.phase !== phase) {
    if (s.phase === 'play') {
      st.sent = 0;
      for (const p of st.players) {
        p.face = 'smile'; p.poseName = 'idle'; p.dist = 0; p.moving = false;
        if (p.sq) p.sq.to(1);
      }
      // 命令札。何をするのかを一瞬で殴り込む。読ませる文章では遅い。
      st.cardWord = game === 'seino' ? 'せーの！' : 'とまれ！';
      st.cardHue = game === 'seino' ? '#2E7BC4' : '#B03050';
      st.cardT = 0;
    }
    if (s.phase === 'reveal') { st.revealT = 0; onReveal(s.last); }
    if (s.phase === 'lobby') { running = false; hintEl.style.opacity = 1; }
    phase = s.phase;
  }
  st.last = s.last ? normalize(s.last) : null;
  Snd.music(s.phase !== 'reveal' && st.players.length > 0, 120);
};
GG.net.onPressed = (n, lv) => {
  st.sent = n;
  if (lv) { live = lv; liveAt = GG.clock.nowServer(); }
};

/* サーバの語彙を Stage の語彙に寄せる。判定側の名前を画面の都合で変えない。 */
function normalize(L) {
  return {
    game: L.game, ok: L.success, spread: L.spread, threshold: L.threshold,
    goal: L.goal, winners: L.winners,
    entries: L.entries.map(e => Object.assign({}, e, {
      fin: e.finishedAt, seed: (e.id * 2654435761 >>> 0) % 1000
    }))
  };
}

function onReveal(L) {
  const ok = L && L.success;
  Snd.duck(.6, .9);
  Snd.sfx(ok ? 'win' : 'lose');
  hitStop = ok ? .12 : .09;
  if (ok) flash = .45; else shake = 12;
  if (!L) return;
  // 全員が同時に同じ顔になると、6体が1つの部品に見える。順位順に遅らせる。
  L.entries.forEach((e, i) => {
    const p = pool.get(e.id); if (!p) return;
    const w = L.winners.indexOf(e.id) >= 0;
    const bad = e.caught || e.error === null || e.error === undefined;
    p.reactAt = .12 + i * .11;
    p.pending = { face: w ? 'joy' : bad ? 'sad' : 'flat',
                  poseName: w ? 'cheer' : bad ? 'flop' : 'idle' };
  });
}

(async () => {
  await GG.clock.sync();
  GG.clock.startRefining();
  net = GG.net.listen();
  requestAnimationFrame(frame);
})();

// ---------------------------------------------------------------- 音の合図
function cue(key, name) {
  if (fired.has(key)) return false;
  fired.add(key); Snd.sfx(name); return true;
}

function seinoCues(left) {
  for (let i = 0; i <= countIn; i++) {
    const at = -(countIn - i) * beat;
    if (left <= at && cue(round + ':c' + i, i === countIn ? 'beat' : 'tick') && i === countIn) {
      hitStop = .06; shake = 8;
    }
  }
}

function darumaCues(t) {
  st.watching = false; st.chant = null;
  for (const ch of gs.chants) {
    if (t >= ch.start) cue(round + ':s' + ch.start, 'chant');
    if (t >= ch.turnAt && cue(round + ':t' + ch.turnAt, 'turn')) { shake = 13; hitStop = .1; }
    if (t >= ch.start && t < ch.watchUntil) {
      st.watching = t >= ch.turnAt;
      st.chant = st.watching ? null : (t - ch.start) / (ch.turnAt - ch.start);
      break;
    }
  }
}

/* 途中経過を補間する。届いた値のまま止めると、押しっぱなしの間 誰も動かず、
 * イベントが届いた瞬間だけワープする。 */
function applyLive() {
  if (!live || !gs) return;
  const t = GG.clock.nowServer();
  for (const p of st.players) {
    const m = live[p.id];
    if (!m) { p.dist = 0; p.moving = false; continue; }
    const held = m.held + (m.moving ? Math.max(0, t - m.at) : 0);
    p.dist = Math.min(st.goal, held / 1000 * (gs.speed || 30));
    p.moving = m.moving;
    p.poseName = m.caught ? 'flop' : m.moving ? (st.watching ? 'shock' : 'walk') : 'idle';
  }
}

// ---------------------------------------------------------------- 描画
function frame(ms) {
  requestAnimationFrame(frame);
  let dt = Math.min(.05, (ms - prevMs) / 1000); prevMs = ms;
  if (hitStop > 0) { hitStop -= dt; dt = 0; }   // ヒットストップ中は世界を止める
  st.tSec += dt; st.revealT += dt;
  st.cardT = Math.min(1, st.cardT + dt / 1.15);

  const dpr = Math.min(devicePixelRatio || 1, 2);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#120724'; c.fillRect(0, 0, W, H);

  if (!st.players.length && !st.code) {
    Art.label(c, 'せつぞく中…', W / 2, H / 2, 28, 'rgba(255,247,232,.5)', { ow: .3 });
    return;
  }

  const beatOn = phase === 'play' && game === 'seino';
  for (const p of st.players) {
    S.stepPlayer(p, dt, st.tSec, { beat: beatOn });
    if (p.pending && st.revealT >= p.reactAt) {
      p.face = p.pending.face; p.poseName = p.pending.poseName;
      const w = p.poseName === 'cheer';
      p.sq.x = w ? .72 : 1.14; p.sq.v = w ? 5 : -1.6;
      p.pending = null;
    }
  }

  c.save();
  if (shake > 0) c.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  if (phase === 'play') {
    if (game === 'seino') {
      st.left = GG.clock.until(gs.target);
      seinoCues(st.left);
      // 溜め。目標の2拍前からしゃがませる。溜めがないと成功が「弾けた」に見えない。
      if (st.left < beat * 2) for (const p of st.players)
        if (p.poseName === 'idle') p.poseName = 'ready';
      S.seino(c, st);
    } else {
      darumaCues(GG.clock.nowServer());
      applyLive();
      S.daruma(c, st);
    }
    if (st.cardT < 1) S.card(c, st);        // 札は開始直後にだけ被せる
  } else if (phase === 'reveal' && st.last) {
    (st.last.game === 'seino' ? S.seinoReveal : S.darumaReveal)(c, st);
  } else {
    S.idle(c, st);
  }

  S.roster(c, st);
  c.restore();

  if (flash > 0) {
    c.fillStyle = 'rgba(255,255,255,' + (flash * .5).toFixed(3) + ')';
    c.fillRect(0, 0, W, H);
  }
  shake = Math.max(0, shake - dt * 44);
  flash = Math.max(0, flash - dt * 2.2);
}
</script>
</body>
</html>
