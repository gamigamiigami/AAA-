<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ミニゲーム ラッシュ</title>
    <!-- viewport-fit=cover so the canvas reaches under a notch; user-scalable=no
         because pinch-zoom during a 4-second microgame is always a mistake. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#63c6f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="ゆびさき ひとつで あそべる ミニゲームあつめ" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #241a33;
        /* No text selection, no callout menus, no double-tap zoom: this is a
           game surface, not a document. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      body.ready #game {
        opacity: 1;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          700 18px/1.6 "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI",
          "Noto Sans JP", "Noto Sans CJK JP", Meiryo, system-ui, sans-serif;
        color: #fffaf2;
        letter-spacing: 0.14em;
        transition: opacity 0.3s ease;
      }
      body.ready #boot {
        opacity: 0;
        pointer-events: none;
      }
      #boot .dot {
        display: inline-block;
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        0%,
        60%,
        100% {
          opacity: 0.25;
        }
        30% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">よみこみちゅう<span class="dot">…</span></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
